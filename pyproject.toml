[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imajev"
version = "1.0.0"
description = "Open Jev-style typed-decision model that also takes images: photo + app state + typed questions in, calibrated probabilities out, locally."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic>=2,<3", "Pillow>=11", "huggingface_hub>=0.30"]

[project.optional-dependencies]
mlx = ["mlx-vlm==0.7.1"]
torch = ["torch>=2.6", "transformers>=4.55", "peft>=0.15", "safetensors>=0.5", "accelerate>=1.0"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
train = ["torch>=2.6", "transformers>=4.55", "peft>=0.15", "safetensors>=0.5", "accelerate>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
vd = "vision_decision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
